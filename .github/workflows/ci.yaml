name: CI

# Everything a pull request runs. image.yaml is a workflow of its own, which
# publish.yaml calls to gate every publish and which runs on its own from the
# Actions tab.
on:
  # Skip pull requests that only touch the README or the licence. The filter
  # excludes rather than lists, so a new file runs CI by default. No check is
  # required by the rulesets, which is what makes a workflow-level filter safe:
  # a skipped required check would block the merge.
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!LICENSE"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Image
    uses: ./.github/workflows/image.yaml
