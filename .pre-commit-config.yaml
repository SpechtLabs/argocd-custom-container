repos:
  # Generic pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-case-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      # devcontainer.json is JSON with comments, which the hook can't parse.
      - id: check-json
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: mixed-line-ending
      - id: check-added-large-files
        name: check for added large files
        description: Prevents giant files from being committed
        args: ["--maxkb=500"]

  # Run the mise-pinned linters rather than copies pre-commit would build, so
  # the hooks and CI agree on the versions. hadolint lints the image's Dockerfile
  # only, as the docker-lint task does.
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: mise exec -- actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: hadolint
        name: hadolint
        entry: mise exec -- hadolint
        language: system
        files: ^Dockerfile$
      - id: shellcheck
        name: shellcheck
        entry: mise exec -- shellcheck
        language: system
        types: [shell]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
